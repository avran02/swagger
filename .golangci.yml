version: "2"

run:
  tests: false

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - forcetypeassert
    - gocognit
    - goconst
    - gocyclo
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - importas
    - ineffassign
    - lll
    - makezero
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    dupl:
      threshold: 500
    lll:
      line-length: 180
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$
      - \.pb\.validate\.go$
      - \.pb\.gw\.go$

formatters:
  enable:
    - gofmt
    - gofumpt
